<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Hub - Pakistan's Marketplace</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d62828">
<link rel="apple-touch-icon" href="/images/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="top-strip">🛒 Shopping Hub — Buy and sell for free anywhere in Pakistan</div>
<header class="glass-header">

    <div class="logo" onclick="goHome()"><span class="logo-badge">S</span><span class="logo-text">SHOPPING<span>HUB</span></span></div>
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Find cars, mobiles, furniture and more...">
      <button onclick="doSearch()">🔍</button>
    </div>
    <div class="userarea" id="userArea"></div>
  </div>
  <nav class="catnav" id="catNav"></nav>
</header>
<main id="main"></main>
<footer>
  <div class="foot-inner">
    <p><b style="opacity:1">SHOPPING HUB</b></p>
    <p>Buy and sell for free anywhere in Pakistan 🇵🇰</p>
  </div>
</footer>
<script src="js/mobile-models.js"></script>
<script src="js/app.js"></script>
</body>
</html>
