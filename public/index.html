<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Hub - Pakistan's Marketplace</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="truck-strip"></div>
<div class="bg-pattern"></div>
<header class="glass-header">
  <div class="topbar">
    <div class="logo" onclick="goHome()"><span class="logo-badge">🛍️</span><span class="logo-text">SHOPPING HUB<small>PAKISTAN</small></span></div>
    <div class="searchbox">
      <input id="searchInput" type="text" placeholder="Search mobiles, cars, furniture...">
      <button onclick="doSearch()">🔍</button>
    </div>
    <div class="userarea" id="userArea"></div>
  </div>
  <nav class="catnav" id="catNav"></nav>
</header>
<main id="main"></main>
<footer>
  <div class="truck-strip"></div>
  <div class="foot-inner">
    <p style="font-size:20px">🚚 🎨 🛍️</p>
    <p><b>Shopping Hub</b> — Pakistan's own truck-art marketplace 🇵🇰<br>Buy & sell anything, anywhere!</p>
  </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
