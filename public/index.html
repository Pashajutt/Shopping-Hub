<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Hub - Pakistan's Marketplace</title>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="bg-blobs"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<header class="glass-header">
  <div class="topbar">
    <div class="logo" onclick="goHome()"><span class="logo-icon">🛍️</span><span class="logo-text">Shopping<em>Hub</em></span></div>
    <div class="searchbox">
      <span class="search-icon">🔍</span>
      <input id="searchInput" type="text" placeholder="Search mobiles, cars, furniture...">
      <button onclick="doSearch()">Search</button>
    </div>
    <div class="userarea" id="userArea"></div>
  </div>
  <nav class="catnav" id="catNav"></nav>
</header>
<main id="main"></main>
<footer>
  <div class="foot-inner">
    <div class="logo"><span class="logo-icon">🛍️</span><span class="logo-text">Shopping<em>Hub</em></span></div>
    <p>Pakistan's own marketplace — buy & sell anything, anywhere. 🇵🇰</p>
  </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
